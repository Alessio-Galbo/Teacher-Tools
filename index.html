<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-title-group">
        <h1 class="app-title" data-i18n="app_title"></h1>
        <span class="app-subtitle" data-i18n="app_subtitle"></span>
      </div>
      <div id="header-year-container" class="header-year-wrapper"></div>

      <button class="tab-btn" data-target="view-students">
